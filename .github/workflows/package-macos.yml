name: Build macOS Packages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DOTNET_VERSION: 10.0.x

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_macos:
    runs-on: macos-26

    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      ContinuousIntegrationBuild: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln*', '**/*.csproj', '**/Directory.Packages.props', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET_VERSION }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The app is signed with "Apple Distribution" and the package with "3rd Party Mac Developer Installer".
      - name: Import signing certificates
        env:
          DISTRIBUTION_P12: ${{ secrets.MACOS_DISTRIBUTION_P12_BASE64 }}
          INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$DISTRIBUTION_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          echo "$INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          for p12 in distribution installer; do
            security import "$RUNNER_TEMP/$p12.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          done
          rm "$RUNNER_TEMP"/*.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v "$KEYCHAIN"

      - name: Install provisioning profile
        run: |
          echo "${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/AppStore.provisionprofile"

      - name: Package (signed .pkg)
        run: docs/store/macos/package-app.sh "$RUNNER_TEMP/AppStore.provisionprofile"

      - name: Upload .pkg
        uses: actions/upload-artifact@v4
        with:
          name: macOS_PKG
          path: artifacts/store/macos/DailyPlants.pkg

      - name: Upload to App Store Connect
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: artifacts/store/macos/DailyPlants.pkg
          app-type: osx
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
