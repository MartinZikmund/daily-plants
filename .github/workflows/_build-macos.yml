name: Build macOS

# Reusable: the desktop head as a macOS app bundle.
# Prod with signing material: the signed, sandboxed universal .pkg for the Mac App Store (docs/store/macos/package-app.sh).
# Otherwise: an unsigned Apple silicon .app, zipped - the Mac App Store profile only matches the Prod bundle ID.
# Publishing lives in release.yml - this workflow never talks to a store.

on:
  workflow_call:
    inputs:
      channel:        { type: string, required: true }
      version_simple: { type: string, required: true }
      artifact_name:  { type: string, required: true }
    secrets:
      MACOS_DISTRIBUTION_P12_BASE64:     { required: false }
      MACOS_INSTALLER_P12_BASE64:        { required: false }
      MACOS_P12_PASSWORD:                { required: false }
      MACOS_PROVISIONING_PROFILE_BASE64: { required: false }

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      ContinuousIntegrationBuild: true
      PROJECT_FILE: src/DailyPlants/DailyPlants.csproj
      TFM: net11.0-desktop
      STORE_PACKAGE: ${{ inputs.channel == 'Prod' && secrets.MACOS_DISTRIBUTION_P12_BASE64 != '' && secrets.MACOS_INSTALLER_P12_BASE64 != '' && secrets.MACOS_P12_PASSWORD != '' && secrets.MACOS_PROVISIONING_PROFILE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-dotnet-build

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The app is signed with "Apple Distribution" and the package with "3rd Party Mac Developer Installer".
      - name: Import signing certificates
        if: env.STORE_PACKAGE == 'true'
        env:
          DISTRIBUTION_P12: ${{ secrets.MACOS_DISTRIBUTION_P12_BASE64 }}
          INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$DISTRIBUTION_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          echo "$INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          for p12 in distribution installer; do
            security import "$RUNNER_TEMP/$p12.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          done
          rm "$RUNNER_TEMP"/*.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v "$KEYCHAIN"

      - name: Package for the Mac App Store (signed .pkg)
        if: env.STORE_PACKAGE == 'true'
        env:
          APP_VERSION: ${{ inputs.version_simple }}
        run: |
          set -euo pipefail
          echo "${{ secrets.MACOS_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/AppStore.provisionprofile"
          docs/store/macos/package-app.sh "$RUNNER_TEMP/AppStore.provisionprofile"
          mkdir -p "$RUNNER_TEMP/stage"
          cp artifacts/store/macos/DailyPlants.pkg "$RUNNER_TEMP/stage/"
          echo "APP_BUNDLE=artifacts/store/macos/Daily Plants.app" >> "$GITHUB_ENV"

      - name: Publish an unsigned app bundle
        if: env.STORE_PACKAGE != 'true'
        run: |
          set -euo pipefail
          if [ "${{ inputs.channel }}" = "Prod" ]; then
            echo "::notice::The four MACOS_* signing secrets are not all set - building an unsigned app. The Mac App Store jobs will skip."
          fi
          # ApplicationVersion=0: Uno.Resizetizer's desktop manifest takes only an integer. The bundle gets X.Y.Z
          # from SetMacOSBundleVersion in the project.
          dotnet publish "$PROJECT_FILE" -c Release -f "$TFM" -r osx-arm64 \
            -p:TargetFrameworks="$TFM" \
            -p:SelfContained=true \
            -p:PackageFormat=app \
            -p:AppChannel=${{ inputs.channel }} \
            -p:CiVersionInjected=true \
            -p:ApplicationDisplayVersion=${{ inputs.version_simple }} \
            -p:ApplicationVersion=0
          app="$(find "src/DailyPlants/bin/Release/$TFM/osx-arm64/publish" -maxdepth 1 -name '*.app' | head -1 || true)"
          [ -n "$app" ] || { echo "::error::no .app produced"; exit 1; }
          mkdir -p "$RUNNER_TEMP/stage"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/stage/DailyPlants-${{ inputs.version_simple }}-osx-arm64.app.zip"
          echo "APP_BUNDLE=$app" >> "$GITHUB_ENV"

      - name: Verify the version and identity in the bundle
        run: |
          set -euo pipefail
          plist="$APP_BUNDLE/Contents/Info.plist"
          cv="$(plutil -extract CFBundleVersion raw "$plist")"
          sv="$(plutil -extract CFBundleShortVersionString raw "$plist")"
          id="$(plutil -extract CFBundleIdentifier raw "$plist")"
          echo "Info.plist: CFBundleIdentifier=$id CFBundleVersion=$cv CFBundleShortVersionString=$sv"
          [ "$cv" = "${{ inputs.version_simple }}" ] || { echo "::error::CFBundleVersion is $cv, expected ${{ inputs.version_simple }}"; exit 1; }
          [ "$sv" = "${{ inputs.version_simple }}" ] || { echo "::error::CFBundleShortVersionString is $sv, expected ${{ inputs.version_simple }}"; exit 1; }
          if [ "${{ inputs.channel }}" = "Prod" ]; then want=dev.mzikmund.dailyplants; else want=dev.mzikmund.dailyplants.dev; fi
          [ "$id" = "$want" ] || { echo "::error::CFBundleIdentifier is $id, expected $want"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/stage
          retention-days: ${{ inputs.channel == 'Prod' && 90 || 14 }}
          if-no-files-found: error
