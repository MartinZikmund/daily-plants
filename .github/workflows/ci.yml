name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - release/**
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  guards:
    name: Version sanity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-dotnet-build

      - name: Version sanity
        uses: ./.github/actions/app-version
        with:
          version-code-offset: ${{ vars.VERSION_CODE_OFFSET }}

  test:
    name: Unit tests
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-dotnet-build
        with:
          workloads: DailyPlants.slnx

      - name: Run unit tests
        run: dotnet test tests/DailyPlants.Tests/DailyPlants.Tests.csproj --configuration Debug --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/TestResults/**/*.trx'

  build:
    name: Build ${{ matrix.name }} (Release)
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: desktop, tfm: net11.0-desktop,           os: ubuntu-24.04 }
          - { name: wasm,    tfm: net11.0-browserwasm,       os: ubuntu-24.04 }
          - { name: android, tfm: net11.0-android,           os: ubuntu-24.04 }
          - { name: windows, tfm: net11.0-windows10.0.26100, os: windows-2025-vs2026 }
          # iOS is left out: macOS runners bill at 10x and build-main.yml builds it on every push to main.
    runs-on: ${{ matrix.os }}
    env:
      ContinuousIntegrationBuild: true

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-dotnet-build
        with:
          workloads: DailyPlants.slnx

      - name: Install wasm-tools
        if: matrix.name == 'wasm'
        run: dotnet workload install wasm-tools

      # Release, not Debug: trimming and AOT analyzer failures must surface on a PR, not on a release branch.
      - name: Build ${{ matrix.name }}
        run: dotnet build src/DailyPlants/DailyPlants.csproj -c Release -f ${{ matrix.tfm }} -p:AppChannel=Dev
