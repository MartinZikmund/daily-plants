version: 2
updates:
- package-ecosystem: nuget
  directories:
  - "*"
  schedule:
    interval: weekly
    time: "04:00"
  open-pull-requests-limit: 10
  target-branch: main
- package-ecosystem: npm
  directories:
  - "*"
  schedule:
    interval: weekly
    time: "04:00"
  open-pull-requests-limit: 10
  target-branch: main
- package-ecosystem: github-actions
  # Composite actions are not scanned from "/", so each needs its own entry.
  directories:
  - "/"
  - "/.github/actions/setup-dotnet-build"
  - "/.github/actions/app-version"
  - "/.github/actions/publish-once"
  schedule:
    interval: weekly
    time: "04:00"
  open-pull-requests-limit: 10
  target-branch: main
