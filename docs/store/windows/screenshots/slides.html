<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Store slides</title>
<!--
  One Microsoft Store screenshot per ?slide=<name>, laid out at 1920x1080 CSS pixels.
  Render-Slides.ps1 renders them at 2560x1440. Open it in a browser with ?slide=hero to iterate.
-->
<style>
  @font-face { font-family: Fraunces; src: url("../../../../src/DailyPlants/Assets/Fonts/Fraunces.ttf"); font-weight: 100 900; }
  @font-face { font-family: Karla; src: url("../../../../src/DailyPlants/Assets/Fonts/Karla.ttf"); font-weight: 200 800; }

  :root {
    --ink: #23271F;
    --ink-muted: #5E6457;
    --green-ink: #3A6244;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }

  .canvas { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: Karla, "Segoe UI", sans-serif;
    background: linear-gradient(#F4F0E3, #EAE4D2 80%); }

  .copy { position: absolute; color: var(--ink); }
  .copy h1 { font-family: Fraunces, Georgia, serif; font-weight: 600; font-variation-settings: "opsz" 144, "SOFT" 40;
    font-size: 88px; line-height: 1.02; letter-spacing: -0.015em; text-wrap: balance; }
  .copy p { font-size: 30px; line-height: 1.4; margin-top: 26px; color: var(--ink-muted); text-wrap: pretty; }
  .copy.center { text-align: center; }
  .copy.center p { margin-left: auto; margin-right: auto; max-width: 900px; }

  .brand { position: absolute; display: flex; align-items: center; gap: 18px; color: var(--green-ink);
    font-family: Fraunces, Georgia, serif; font-weight: 600; font-variation-settings: "opsz" 72; font-size: 40px; }
  .brand img { width: 64px; height: 64px; }

  /* The windowsill: a ledge face, then the sill running to the bottom edge */
  .sill { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(#3F6A4A, #2C4F35); }
  .sill::before { content: ""; position: absolute; left: 0; right: 0; top: -24px; height: 24px; background: linear-gradient(#5C8C66, #4C7A56);
    box-shadow: 0 14px 30px rgba(20, 40, 25, .35); }
  .sill.split { background: linear-gradient(100deg, #3F6A4A 0 52%, #1F3526 52%); }
  .sill.split::before { background: linear-gradient(100deg, #5C8C66 0 52%, #34543C 52%); }

  .window { position: absolute; border-radius: 12px; overflow: hidden;
    box-shadow: 0 1px 0 rgba(255, 255, 255, .6) inset, 0 30px 70px rgba(35, 39, 31, .22), 0 6px 18px rgba(35, 39, 31, .14); }
  .window img { display: block; width: 100%; }
  .window.dark { box-shadow: 0 0 0 1px rgba(255, 255, 255, .06), 0 40px 90px rgba(0, 0, 0, .5); }

  .callout { position: absolute; border-radius: 14px; background-repeat: no-repeat; background-color: #F7F6F0;
    box-shadow: 0 0 0 1px rgba(35, 39, 31, .06), 0 36px 70px rgba(35, 39, 31, .26), 0 8px 20px rgba(35, 39, 31, .14); }

  .food { position: absolute; filter: drop-shadow(0 16px 12px rgba(20, 40, 25, .28)); }
  .glow { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 214, 150, .22), transparent); }

  .grain { position: absolute; inset: 0; pointer-events: none; opacity: .08; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
</style>
</head>
<body>
<div class="canvas" id="canvas"></div>
<script>
  const FOODS = '../../../../src/DailyPlants/Assets/Icons/Items/Fluent/';
  const APP_ICON = '../../../../src/DailyPlants/Assets/Svg/applogo.svg';
  // Capture-App.ps1 writes every capture at this size, and the crops below are in its pixels.
  const CAPTURE = { w: 2400, h: 1400 };

  // The headline is also the screenshot's caption in the listing (ScreenshotCaptions in listing/en.md).
  const TEXT = {
    hero: { title: 'Eat more plants, every day', sub: 'A daily checklist for Dr. Greger’s Daily Dozen and Twenty-One Tweaks. One tap per serving.' },
    details: { title: 'Know what counts', sub: 'Serving sizes, what each item includes and why it matters.' },
    statistics: { title: 'Watch your streak grow', sub: 'Thirty days of progress, what you miss most and your weight trend.' },
    achievements: { title: '31 achievements to earn', sub: 'From your first perfect day to a streak that lasts a whole year.' },
    resources: { title: 'Learn as you go', sub: 'The latest articles, videos, podcasts and recipes from NutritionFacts.org.' },
    dark: { title: 'Easy on the eyes at night', sub: 'Light, dark and high contrast themes, in 21 languages.' },
  };

  const slide = new URLSearchParams(location.search).get('slide') || 'hero';
  const text = TEXT[slide];

  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const copy = (x, y, w, cls = '') =>
    `<div class="copy ${cls}" style="left:${x}px;top:${y}px;width:${w}px"><h1>${esc(text.title)}</h1><p>${esc(text.sub)}</p></div>`;
  const sill = (top, cls = '') => `<div class="sill ${cls}" style="top:${top}px"></div>`;

  // A capture in a window frame. It stands on the sill unless a top is given.
  const win = (capture, x, w, { sillTop, top, cls = '' }) => {
    const h = w * CAPTURE.h / CAPTURE.w;
    const y = top ?? sillTop - h;
    return `<div class="window ${cls}" style="left:${x}px;top:${y}px;width:${w}px"><img src="captures/${capture}.png"></div>`;
  };

  // A crop of a capture, enlarged and lifted out of the window. crop is in capture pixels.
  const callout = (capture, crop, x, w, { sillTop, top, rotate = 0 }) => {
    const scale = w / crop.w, h = crop.h * scale;
    const y = top ?? sillTop - h;
    return `<div class="callout" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:rotate(${rotate}deg);`
      + `background-image:url(captures/${capture}.png);background-size:${CAPTURE.w * scale}px auto;background-position:-${crop.x * scale}px -${crop.y * scale}px"></div>`;
  };

  const food = (icon, x, w, sillTop, style = '') =>
    `<img class="food" src="${FOODS}${icon}.svg" style="left:${x}px;top:${sillTop - w + 4}px;width:${w}px;${style}">`;

  // Every slide gets its own composition so the set doesn't read as one screenshot six times.
  const layouts = {
    // The app's name and what it is, the diary standing on the sill beside a few foods.
    hero: () => {
      const s = 930;
      return sill(s) + food('berries', 84, 170, s) + food('greens', 256, 150, s) + food('other_vegetables', 420, 140, s)
        + `<div class="brand" style="left:104px;top:104px"><img src="${APP_ICON}">Daily Plants</div>`
        + copy(104, 210, 480) + win('diary', 600, 1284, { sillTop: s });
    },
    // The diary off the left edge, the item dialog standing in front of it, copy to the right.
    details: () => {
      const s = 930;
      return sill(s) + win('diary', -150, 1290, { sillTop: s })
        + callout('details', { x: 793, y: 258, w: 814, h: 883 }, 690, 560, { sillTop: s })
        + copy(1330, 130, 500) + food('other_fruits', 1540, 150, s) + food('greens', 1720, 130, s);
    },
    // Centred copy, the window centred on the sill, the weight chart lifted out over its corner.
    statistics: () => {
      const s = 962;
      return sill(s) + copy(260, 64, 1400, 'center')
        + food('other_vegetables', 120, 150, s) + food('nuts', 280, 120, s)
        + win('statistics', 385, 1150, { sillTop: s })
        + callout('statistics-weight', { x: 560, y: 890, w: 1760, h: 410 }, 1090, 790, { top: 680 });
    },
    // A big window off the right edge, earned badges propped on the sill like picture frames.
    achievements: () => {
      const s = 950;
      const tiles = [{ x: 596, y: 622 }, { x: 938, y: 622 }, { x: 1280, y: 1146 }]
        .map((t, i) => callout('achievements', { x: t.x, y: t.y, w: 317, h: 214 }, 80 + i * 205, 230, { sillTop: s, rotate: [-4, 2, -1.5][i] }))
        .join('');
      return sill(s) + copy(104, 120, 640) + win('achievements', 790, 1420, { sillTop: s }) + tiles;
    },
    // The window seen over the sill, its tab strip lifted out above it.
    resources: () => {
      const s = 880;
      return win('resources', 540, 1320, { top: 170 }) + sill(s)
        + copy(104, 120, 420)
        + callout('resources', { x: 580, y: 190, w: 980, h: 140 }, 1010, 820, { top: 96, rotate: -1.5 })
        + food('other_fruits', 104, 150, s) + food('berries', 270, 130, s);
    },
    // Day and night side by side, the dark window in front.
    dark: () => {
      const s = 960;
      const night = '<div style="position:absolute;inset:0;background:linear-gradient(100deg,transparent 0 52%,#1D221B 52%)"></div>';
      const glow = '<div class="glow" style="left:1080px;top:180px;width:900px;height:700px"></div>';
      return night + glow + sill(s, 'split') + copy(104, 110, 720)
        + win('diary', 90, 900, { sillTop: s })
        + win('diary-dark', 800, 1060, { sillTop: s, cls: 'dark' })
        + food('berries', 1740, 130, s, 'filter:drop-shadow(0 16px 12px rgba(0,0,0,.4)) brightness(.8)');
    },
  };

  document.getElementById('canvas').innerHTML = layouts[slide]() + '<div class="grain"></div>';
</script>
</body>
</html>
