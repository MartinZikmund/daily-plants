<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App Store slides</title>
<!--
  One App Store screenshot per ?device=iphone|ipad&slide=<name>. The iPhone canvas is 440x956 CSS pixels and the
  iPad one 1376x1032, the screen sizes in points. render-slides.sh renders them at 3x and 2x.
-->
<style>
  @font-face { font-family: Fraunces; src: url("../../../../src/DailyPlants/Assets/Fonts/Fraunces.ttf"); font-weight: 100 900; }
  @font-face { font-family: Karla; src: url("../../../../src/DailyPlants/Assets/Fonts/Karla.ttf"); font-weight: 200 800; }

  :root {
    --ink: #23271F;
    --ink-muted: #5E6457;
    --green-ink: #3A6244;
    --bezel: #1F221D;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { overflow: hidden; }

  .canvas { position: relative; overflow: hidden; font-family: Karla, sans-serif; background: linear-gradient(#F4F0E3, #EAE4D2 80%); }

  .copy { position: absolute; color: var(--ink); }
  .copy h1 { font-family: Fraunces, Georgia, serif; font-weight: 600; font-variation-settings: "opsz" 144, "SOFT" 40;
    line-height: 1.02; letter-spacing: -0.015em; text-wrap: balance; }
  .copy p { line-height: 1.4; color: var(--ink-muted); text-wrap: pretty; }
  .copy.center { text-align: center; }
  .copy.center p { margin-left: auto; margin-right: auto; }
  .iphone .copy h1 { font-size: 40px; }
  .iphone .copy p { font-size: 17px; margin-top: 12px; max-width: 360px; }
  .ipad .copy h1 { font-size: 64px; }
  .ipad .copy p { font-size: 22px; margin-top: 18px; max-width: 640px; }

  .brand { position: absolute; display: flex; align-items: center; color: var(--green-ink);
    font-family: Fraunces, Georgia, serif; font-weight: 600; font-variation-settings: "opsz" 72; }
  .iphone .brand { gap: 10px; font-size: 22px; }
  .iphone .brand img { width: 36px; height: 36px; }
  .ipad .brand { gap: 14px; font-size: 30px; }
  .ipad .brand img { width: 48px; height: 48px; }

  /* The windowsill: a ledge face, then the sill running to the bottom edge */
  .sill { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(#3F6A4A, #2C4F35); }
  .sill::before { content: ""; position: absolute; left: 0; right: 0; top: -14px; height: 14px; background: linear-gradient(#5C8C66, #4C7A56);
    box-shadow: 0 10px 22px rgba(20, 40, 25, .35); }
  .ipad .sill::before { top: -18px; height: 18px; }
  .sill.split { background: linear-gradient(100deg, #3F6A4A 0 52%, #1F3526 52%); }
  .sill.split::before { background: linear-gradient(100deg, #5C8C66 0 52%, #34543C 52%); }
  .sill.night { background: #1F3526; }
  .sill.night::before { background: #34543C; }

  /* A device: a dark bezel around the capture */
  .device { position: absolute; background: var(--bezel);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, .12) inset, 0 30px 60px rgba(35, 39, 31, .28), 0 6px 16px rgba(35, 39, 31, .16); }
  .device img { display: block; width: 100%; }
  .device.dark { box-shadow: 0 0 0 1px rgba(255, 255, 255, .1), 0 40px 80px rgba(0, 0, 0, .5); }
  .island { position: absolute; left: 50%; transform: translateX(-50%); background: #000; border-radius: 999px; }

  .callout { position: absolute; background-repeat: no-repeat; background-color: #F7F6F0;
    box-shadow: 0 0 0 1px rgba(35, 39, 31, .06), 0 28px 56px rgba(35, 39, 31, .26), 0 6px 16px rgba(35, 39, 31, .14); }

  .food { position: absolute; filter: drop-shadow(0 12px 9px rgba(20, 40, 25, .28)); }
  .glow { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 214, 150, .22), transparent); }

  .grain { position: absolute; inset: 0; pointer-events: none; opacity: .08; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
</style>
</head>
<body>
<div class="canvas" id="canvas"></div>
<script>
  const FOODS = '../../../../src/DailyPlants/Assets/Icons/Items/Fluent/';
  const APP_ICON = '../../../../src/DailyPlants/Assets/Svg/applogo.svg';

  // Same headlines as the Microsoft Store slides (docs/store/windows/screenshots/slides.html).
  const TEXT = {
    hero: { title: 'Eat more plants, every day', sub: 'A daily checklist for Dr. Greger’s Daily Dozen and Twenty-One Tweaks. One tap per serving.' },
    details: { title: 'Know what counts', sub: 'Serving sizes, what each item includes and why it matters.' },
    statistics: { title: 'Watch your streak grow', sub: 'Thirty days of progress, what you miss most and your weight trend.' },
    achievements: { title: '31 achievements to earn', sub: 'From your first perfect day to a streak that lasts a whole year.' },
    resources: { title: 'Learn as you go', sub: 'The latest articles, videos, podcasts and recipes from NutritionFacts.org.' },
    dark: { title: 'Easy on the eyes at night', sub: 'Light and dark themes, in 21 languages.' },
  };

  const params = new URLSearchParams(location.search);
  const device = params.get('device') || 'iphone';
  const slide = params.get('slide') || 'hero';
  const text = TEXT[slide];

  // Canvas size in CSS pixels, and each capture's size in its own pixels. Crops below are in capture pixels.
  const SPEC = {
    iphone: { w: 440, h: 956, capture: { w: 1320, h: 2868 }, radius: 0.13, bezel: 0.028 },
    ipad: { w: 1376, h: 1032, capture: { w: 2752, h: 2064 }, radius: 0.028, bezel: 0.014 },
  }[device];
  const CAPTURE = SPEC.capture;

  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const copy = (x, y, w, cls = '') =>
    `<div class="copy ${cls}" style="left:${x}px;top:${y}px;width:${w}px"><h1>${esc(text.title)}</h1><p>${esc(text.sub)}</p></div>`;
  const sill = (top, cls = '') => `<div class="sill ${cls}" style="top:${top}px"></div>`;
  const brand = (x, y) => `<div class="brand" style="left:${x}px;top:${y}px"><img src="${APP_ICON}">Daily Plants</div>`;

  // A capture in a device frame, w wide including the bezel. It stands on the sill unless a top is given.
  const frame = (capture, x, w, { sillTop, top, cls = '', rotate = 0 }) => {
    const bezel = Math.round(w * SPEC.bezel);
    const inner = w - 2 * bezel;
    const h = inner * CAPTURE.h / CAPTURE.w + 2 * bezel;
    const y = top ?? sillTop - h;
    const radius = w * SPEC.radius;
    const island = device === 'iphone'
      ? `<div class="island" style="top:${bezel + inner * 0.024}px;width:${inner * 0.28}px;height:${inner * 0.083}px"></div>` : '';
    return `<div class="device ${cls}" style="left:${x}px;top:${y}px;width:${w}px;padding:${bezel}px;border-radius:${radius}px;transform:rotate(${rotate}deg)">`
      + `<img src="captures/${device}/${capture}.png" style="border-radius:${radius - bezel}px">${island}</div>`;
  };

  // A crop of a capture, enlarged and lifted out of the frame. crop is in capture pixels.
  const callout = (capture, crop, x, w, { sillTop, top, rotate = 0, radius = 12 }) => {
    const scale = w / crop.w, h = crop.h * scale;
    const y = top ?? sillTop - h;
    return `<div class="callout" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${radius}px;transform:rotate(${rotate}deg);`
      + `background-image:url(captures/${device}/${capture}.png);background-size:${CAPTURE.w * scale}px auto;background-position:-${crop.x * scale}px -${crop.y * scale}px"></div>`;
  };

  const food = (icon, x, w, sillTop, style = '') =>
    `<img class="food" src="${FOODS}${icon}.svg" style="left:${x}px;top:${sillTop - w + 3}px;width:${w}px;${style}">`;

  const night = (split, angle = 100) => `<div style="position:absolute;inset:0;background:linear-gradient(${angle}deg,transparent 0 ${split}%,#1D221B ${split}%)"></div>`;

  // Every slide gets its own composition so the set doesn't read as one screenshot six times.
  const layouts = {
    // Portrait: copy on top, the phone standing on the sill, cropped by the bottom edge where it needs room.
    iphone: {
      hero: () => {
        const s = 900;
        return sill(s) + brand(32, 56) + copy(32, 110, 380)
          + food('berries', 14, 74, s) + food('greens', 350, 70, s)
          + frame('diary', 70, 300, { top: 330 });
      },
      details: () => {
        const s = 900;
        return sill(s) + copy(32, 64, 380)
          + frame('diary', -40, 280, { top: 300, rotate: -3 })
          + callout('details', { x: 0, y: 600, w: 1320, h: 1740 }, 150, 270, { top: 390, rotate: 2, radius: 18 })
          + food('other_fruits', 330, 70, s);
      },
      statistics: () => {
        const s = 900;
        return sill(s) + copy(30, 64, 380, 'center')
          + frame('statistics', 70, 300, { top: 290 })
          + callout('statistics-weight', { x: 40, y: 1790, w: 1240, h: 660 }, 24, 392, { top: 610, rotate: -1.5 });
      },
      achievements: () => {
        const s = 912;
        // The first three badges, square around the icon and its label.
        const tiles = [0, 1, 2]
          .map(i => callout('achievements', { x: 456, y: 880 + i * 476, w: 400, h: 390 }, 20 + i * 136, 116, { sillTop: s, rotate: [-4, 2, -1.5][i], radius: 10 }))
          .join('');
        return sill(s) + copy(32, 64, 380) + frame('achievements', 90, 280, { top: 290 }) + tiles;
      },
      resources: () => {
        const s = 900;
        return frame('resources', 70, 300, { top: 300 }) + sill(s) + copy(32, 64, 380)
          + food('other_fruits', 16, 72, s) + food('berries', 356, 66, s);
      },
      dark: () => {
        const s = 900;
        // Night falls across the lower part, under the copy.
        const glow = '<div class="glow" style="left:120px;top:300px;width:420px;height:560px"></div>';
        return night(34, 160) + glow + sill(s, 'night') + copy(32, 64, 380)
          + frame('diary', -10, 250, { top: 330 })
          + frame('diary-dark', 180, 270, { top: 290, cls: 'dark' });
      },
    },
    // Landscape, after the Microsoft Store slides.
    ipad: {
      hero: () => {
        const s = 900;
        return sill(s) + food('berries', 56, 120, s) + food('greens', 180, 106, s) + food('other_vegetables', 296, 100, s)
          + brand(64, 70) + copy(64, 150, 360) + frame('diary', 440, 900, { sillTop: s });
      },
      details: () => {
        const s = 900;
        return sill(s) + frame('diary', -120, 880, { sillTop: s })
          + callout('details', { x: 826, y: 452, w: 1092, h: 1190 }, 470, 400, { sillTop: s })
          + copy(920, 110, 400) + food('other_fruits', 1090, 110, s) + food('greens', 1220, 96, s);
      },
      statistics: () => {
        const s = 930;
        return sill(s) + copy(188, 44, 1000, 'center')
          + food('other_vegetables', 70, 110, s) + food('nuts', 186, 90, s)
          + frame('statistics', 300, 780, { sillTop: s })
          + callout('statistics-weight', { x: 790, y: 1360, w: 1830, h: 620 }, 740, 580, { top: 600 });
      },
      achievements: () => {
        const s = 910;
        const tiles = [{ x: 793, y: 500 }, { x: 1250, y: 500 }, { x: 793, y: 878 }]
          .map((t, i) => callout('achievements', { x: t.x, y: t.y, w: 430, h: 290 }, 40 + i * 150, 170, { sillTop: s, rotate: [-4, 2, -1.5][i] }))
          .join('');
        return sill(s) + copy(64, 96, 460) + frame('achievements', 540, 960, { sillTop: s }) + tiles;
      },
      resources: () => {
        const s = 850;
        return frame('resources', 400, 900, { top: 150 }) + sill(s)
          + copy(64, 96, 320)
          + callout('resources', { x: 790, y: 400, w: 1830, h: 100 }, 640, 700, { top: 70, rotate: -1.5 })
          + food('other_fruits', 64, 110, s) + food('berries', 184, 96, s);
      },
      dark: () => {
        const s = 930;
        const glow = '<div class="glow" style="left:760px;top:140px;width:640px;height:560px"></div>';
        return night(52) + glow + sill(s, 'split') + copy(64, 84, 520)
          + frame('diary', 40, 680, { sillTop: s })
          + frame('diary-dark', 560, 760, { sillTop: s, cls: 'dark' })
          + food('berries', 1260, 96, s, 'filter:drop-shadow(0 12px 9px rgba(0,0,0,.4)) brightness(.8)');
      },
    },
  };

  const canvas = document.getElementById('canvas');
  canvas.className = `canvas ${device}`;
  canvas.style.width = document.body.style.width = `${SPEC.w}px`;
  canvas.style.height = document.body.style.height = `${SPEC.h}px`;
  canvas.innerHTML = layouts[device][slide]() + '<div class="grain"></div>';
</script>
</body>
</html>
